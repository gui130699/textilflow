name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GCLOUD_PROJECT: demo-textilflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm --prefix functions ci
      - run: node scripts/setup-emulator-env.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix functions run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/emulators.mjs emulators:exec --only auth,firestore,functions,storage "npm run test:integration && npm run seed && npm run test:e2e"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

