services:
  - type: web
    name: textilflow-piloto
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --hostname 0.0.0.0
    healthCheckPath: /login
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_MODE
        value: server
      - key: NEXT_PUBLIC_USE_EMULATORS
        value: "false"
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyDhDBYvMmZ5vaKhon6r6v1HL7IGvB7o8Ao
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: textilflow-gui130699.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: textilflow-gui130699
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:180669335706:web:47ce6ba5adc9bac7987723
      - key: GCLOUD_PROJECT
        value: textilflow-gui130699
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
